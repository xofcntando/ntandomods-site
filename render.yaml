services:
  - type: web
    name: ntandomods-web
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: API_BASE
        value: https://ladybug-api-e8q8.onrender.com
      - key: CLOUD_URL
        value: https://ladybugcloud.xubi.org/
      - key: CONTACT_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
